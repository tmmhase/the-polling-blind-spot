[project]
name = "polling-blind-spot"
version = "0.1.0"
description = "Historical polling error and uncertainty in the 2026 U.S. Senate elections."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
